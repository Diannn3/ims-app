name: App quality

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Replace with `npm ci` after the first verified package-lock.json is committed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Static project/data invariants
        run: npm run verify

      - name: Svelte and TypeScript checks
        run: npm run check

      - name: Domain tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Install Chromium for smoke journeys
        run: npx playwright install --with-deps chromium

      - name: Browser smoke journeys
        run: npm run test:e2e
