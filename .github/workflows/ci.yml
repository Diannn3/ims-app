name: App quality

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Replace with `npm ci` after the first verified package-lock.json is committed.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Static project/data invariants
        run: npm run verify

      - name: Framework-free domain typecheck
        run: npm run check:domain

      - name: Svelte and TypeScript checks
        run: npm run check

      - name: Domain tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Install Chromium for smoke journeys
        run: npx playwright install --with-deps chromium

      - name: Browser smoke journeys
        run: npm run test:e2e

      - name: Record successful app-gate evidence
        run: npm run evidence:app

      - name: Upload app-gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: app-gate-evidence
          path: validation-evidence/app-gate.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
