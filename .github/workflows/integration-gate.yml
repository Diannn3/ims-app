name: Seeded integration gate

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ims-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Setup pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.110.0

      - name: Start and replay local Supabase
        run: |
          supabase start
          supabase db reset

      - name: Export only browser-safe local Supabase connection values
        env:
          SUPABASE_BIN: supabase
        run: node scripts/export-local-supabase-public-env.mjs >> "$GITHUB_ENV"

      - name: Prepare local-only staff fixtures
        env:
          SUPABASE_BIN: supabase
        run: node scripts/seed-integration-auth.mjs

      - name: Static and framework checks against the integrated source tree
        run: |
          npm run verify
          npm run check:domain
          npm run check
          npm run test:unit

      - name: Confirm database security and generated-type contract
        env:
          SUPABASE_BIN: supabase
        run: |
          supabase db lint --local --schema public,private --level warning --fail-on error
          supabase test db
          node scripts/check-database-types.mjs

      - name: Build production application with local Supabase configuration
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run seeded browser integration journeys
        env:
          INTEGRATION_SUPABASE: '1'
        run: npx playwright test tests/e2e/integration.spec.ts

      - name: Record successful integration evidence
        run: npm run evidence:integration

      - name: Upload integration evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: seeded-integration-evidence
          path: |
            validation-evidence/integration-gate.json
            validation-evidence/database.types.generated.ts
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop local Supabase
        if: always()
        run: supabase stop || true
